name: SERIE public app tests
on:
  push:
    branches: [main]
    paths: ['serie/**', '.github/workflows/serie-tests.yml']
  pull_request:
    paths: ['serie/**', '.github/workflows/serie-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: training-lab/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: training-lab
      - run: node serie/tests/public.cjs && node --test serie/tests/offline.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/training-lab/node_modules

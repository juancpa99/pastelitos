name: Patch Training Lab season complements

on:
  push:
    paths:
      - '.github/workflows/patch-season-complements.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply season complement patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          exec(base64.b64decode('        ,dGVtcGxhdGVLZXk6dHBsLmtleSxjb21wbGV0ZWQ6ZmFsc2Usc3RhcnRlZEF0Om51bGwsZXhlcmNpc2VzOnN0cnVjdHVyZWRDbG9uZSh0cGwuZXhlcmNpc2VzKS5tYXAoZT0+bm9ybWFsaXplU2Vzc2lvbkV4ZXJjaXNlKHsuLi5lLHJlY29yZGVkU2V0czpbXX0pKX0pOwogIHNhdmVTdGF0ZSh0cnVlKTtyZW5kZXJXb3Jrb3V0KCk7ZWRpdEV4dHJhU2Vzc2lvbihpZCkKfQo='))
          PY
      - name: Run Training Lab tests
        run: |
          cd training-lab
          node --check usability.js
          npm init -y >/dev/null 2>&1
          npm install --silent jsdom@26
          node tests/usability.cjs
      - name: Commit season complements
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-season-complements.yml
          git add training-lab/usability.js training-lab/index.html training-lab/sw.js training-lab/tests/usability.cjs
          git commit -m 'Add Training Lab season aesthetic and mobility complements'
          git push

name: Patch Training Lab season complements

on:
  push:
    paths:
      - '.github/workflows/patch-season-complements.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add season aesthetic and mobility complements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          usability = Path('training-lab/usability.js')
          text = usability.read_text(encoding='utf-8')

          block = r'''
// Season complements: low-systemic-fatigue aesthetic volume and mobility around L-X-V swimming.
const SEASON_COMPLEMENT_TEMPLATES = {
  1: {
    key: "season_mon_aesthetic",
    title: "Complementario estético + movilidad",
    timing: "Ideal 16–17 h · natación 22–23 h",
    note: "Volumen de baja fatiga para brazos, gemelos, deltoide lateral y glúteo medio. Mantén 2–3 RIR para llegar fresco a la piscina.",
    exercises: [
      {key:"seated_calf",name:"Gemelo sentado",type:"strength",sets:3,min:10,max:15,rir:"2",rest:"90 s",muscle:"Gemelos",note:"ROM completo; pausa abajo y arriba."},
      {key:"cable_curl",name:"Curl de bíceps en polea",type:"strength",sets:3,min:10,max:15,rir:"2–3",rest:"90 s",muscle:"Bíceps",note:"Técnica estricta; no busques fallo antes de nadar."},
      {key:"triceps_pushdown",name:"Extensión de tríceps en polea",type:"strength",sets:3,min:10,max:15,rir:"2–3",rest:"90 s",muscle:"Tríceps",note:"Codos estables; deja margen para la natación."},
      {key:"cable_lateral_raise",name:"Elevación lateral en polea",type:"strength",sets:2,min:12,max:20,rir:"3",rest:"60–90 s",muscle:"Deltoide lateral",note:"Baja fatiga; sin dolor ni compensación."},
      {key:"hip_abduction",name:"Abducción de cadera",type:"strength",sets:2,min:15,max:20,rir:"2–3",rest:"60–90 s",muscle:"Glúteo medio",note:"Pausa breve en apertura."},
      {key:"season_band_external_rotation",name:"Rotación externa con banda",type:"mobility",group:"Hombro/escápula",dose:"2 × 15–20",note:"Muy suave; deja aproximadamente 5 RIR."},
      {key:"season_wall_slides",name:"Wall slides",type:"mobility",group:"Hombro/escápula",dose:"2 × 10",note:"Control escapular sin forzar rango."},
      {key:"season_open_book",name:"Open book",type:"mobility",group:"Torácica",dose:"1 × 8 por lado",note:"Rotación torácica lenta."},
      {key:"season_lat_stretch",name:"Estiramiento dorsal",type:"mobility",group:"Torácica/hombro",dose:"1 × 30–45 s por lado",note:"Respiración tranquila."},
      {key:"season_pec_stretch",name:"Estiramiento suave de pectoral",type:"mobility",group:"Hombro/pectoral",dose:"1 × 30–45 s por lado",note:"Sin llevar el hombro a molestia."}
    ]
  },
  3: {
    key: "season_wed_mobility",
    title: "Movilidad completa",
    timing: "Ideal 16–17 h · natación 22–23 h",
    note: "Sesión global de movilidad para tobillo, cadera, columna torácica y cintura escapular. No es un entrenamiento al fallo.",
    exercises: [
      {key:"season_knee_to_wall",name:"Knee-to-wall",type:"mobility",group:"Tobillo",dose:"2 × 10 + 30 s por lado",note:"Talón apoyado; gana dorsiflexión sin dolor."},
      {key:"season_deep_squat",name:"Sentadilla profunda asistida",type:"mobility",group:"Tobillo/cadera",dose:"2 × 45 s",note:"Usa apoyo si permite una posición más limpia."},
      {key:"season_9090",name:"90/90 switches",type:"mobility",group:"Cadera",dose:"2 × 8 por lado",note:"Controla la rotación, sin rebotes."},
      {key:"season_couch",name:"Couch stretch",type:"mobility",group:"Cadera/cuádriceps",dose:"2 × 45 s por lado",note:"Pelvis neutra y glúteo contraído."},
      {key:"season_adductor",name:"Adductor rockback",type:"mobility",group:"Cadera/aductores",dose:"2 × 10 por lado",note:"Movimiento lento."},
      {key:"season_open_book_wed",name:"Open book",type:"mobility",group:"Torácica",dose:"2 × 8 por lado",note:"Respira al abrir."},
      {key:"season_lat_stretch_wed",name:"Estiramiento dorsal",type:"mobility",group:"Torácica/hombro",dose:"2 × 45 s por lado",note:"No fuerces el hombro."},
      {key:"season_wall_slides_wed",name:"Wall slides",type:"mobility",group:"Hombro/escápula",dose:"2 × 10",note:"Costillas controladas."},
      {key:"season_band_external_rotation_wed",name:"Rotación externa con banda",type:"mobility",group:"Hombro/escápula",dose:"2 × 15–20",note:"Resistencia ligera; aproximadamente 5 RIR."},
      {key:"season_pec_stretch_wed",name:"Estiramiento suave de pectoral",type:"mobility",group:"Hombro/pectoral",dose:"2 × 30–45 s por lado",note:"Sin dolor anterior del hombro."}
    ]
  },
  6: {
    key: "season_sat_aesthetic",
    title: "Finisher estético",
    timing: "Después del Full Body C",
    note: "Completa el volumen semanal donde el full body se queda corto sin añadir más espalda o presses.",
    exercises: [
      {key:"leg_extension",name:"Extensión de cuádriceps",type:"strength",sets:2,min:12,max:15,rir:"2",rest:"90 s",muscle:"Cuádriceps",note:"Baja fatiga sistémica; control excéntrico."},
      {key:"standing_calf",name:"Gemelo de pie",type:"strength",sets:3,min:10,max:15,rir:"1–2",rest:"90 s",muscle:"Gemelos",note:"ROM completo y pausa en estiramiento."},
      {key:"hip_abduction",name:"Abducción de cadera",type:"strength",sets:2,min:15,max:20,rir:"1–2",rest:"60–90 s",muscle:"Glúteo medio",note:"Pausa breve en apertura."}
    ]
  }
};
function seasonComplementTemplate(date=currentDate()){
  if(state.settings.mode!=="season")return null;
  return SEASON_COMPLEMENT_TEMPLATES[weekday(date)]||null
}
function seasonComplementSession(date=currentDate()){
  const tpl=seasonComplementTemplate(date);if(!tpl)return null;
  return state.extraSessions.find(s=>s.date===date&&s.templateKey===tpl.key)||null
}
function seasonComplementHTML(date=currentDate()){
  const tpl=seasonComplementTemplate(date);if(!tpl)return "";
  const existing=seasonComplementSession(date),strength=tpl.exercises.filter(e=>e.type==="strength"),mobility=tpl.exercises.filter(e=>e.type==="mobility");
  const summary=[strength.length?`${strength.reduce((n,e)=>n+(+e.sets||0),0)} series de fuerza`:"",mobility.length?`${mobility.length} ejercicios de movilidad`:""].filter(Boolean).join(" · ");
  return `<div class="card season-complement-card"><div class="eyebrow">Complemento programado</div><div class="hero-title" style="font-size:18px">${esc(tpl.title)}</div><div class="subtitle">${esc(tpl.timing)} · ${esc(summary)}</div><div class="callout" style="margin-top:8px">${esc(tpl.note)}</div><div class="actions" style="margin-top:10px">${existing?`<button class="btn secondary" onclick="editExtraSession('${existing.id}')">${existing.completed?"Ver complemento guardado":"Abrir complemento"}</button>`:`<button class="btn" onclick="createSeasonComplement()">Añadir y registrar</button>`}</div></div>`
}
function createSeasonComplement(){
  const tpl=seasonComplementTemplate();if(!tpl)return;
  const existing=seasonComplementSession();if(existing){editExtraSession(existing.id);return}
  const id="season_"+tpl.key+"_"+Date.now().toString(36);
  state.extraSessions.push({id,date:currentDate(),title:tpl.title,templateKey:tpl.key,completed:false,startedAt:null,exercises:structuredClone(tpl.exercises).map(e=>normalizeSessionExercise({...e,recordedSets:[]}))});
  saveState(true);renderWorkout();editExtraSession(id)
}
'''

          anchor = 'const legacyRenderWorkout = renderWorkout;'
          if 'const SEASON_COMPLEMENT_TEMPLATES' not in text:
              if anchor not in text:
                  raise SystemExit('renderWorkout anchor not found')
              text = text.replace(anchor, block + '\n' + anchor, 1)

          old = '''renderWorkout = function () {
  legacyRenderWorkout();
  document
    .getElementById("viewWorkout")
    .insertAdjacentHTML(
      "afterbegin",
      `<div class="card"><button class="btn secondary" onclick="openPendingWorkouts()">Hacer un entreno pendiente otro día</button></div>`,
    );
};'''
          new = '''renderWorkout = function () {
  legacyRenderWorkout();
  const root=document.getElementById("viewWorkout");
  root.insertAdjacentHTML(
    "afterbegin",
    `<div class="card"><button class="btn secondary" onclick="openPendingWorkouts()">Hacer un entreno pendiente otro día</button></div>`,
  );
  const complement=seasonComplementHTML(currentDate());
  if(complement)root.insertAdjacentHTML("afterbegin",complement);
};'''
          if old in text:
              text = text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('renderWorkout wrapper not found')

          # Include scheduled complements in the weekly muscle-volume radar.
          volume_patch = r'''
const baseWeeklyPlannedMuscleSets = weeklyPlannedMuscleSets;
weeklyPlannedMuscleSets = function(){
  const out=baseWeeklyPlannedMuscleSets();
  if(state.settings.mode!=="season")return out;
  Object.values(SEASON_COMPLEMENT_TEMPLATES).forEach(tpl=>tpl.exercises.filter(e=>e.type==="strength").forEach(e=>{
    muscleGroupsForExercise(e).forEach(g=>{if(g in out)out[g]+=(+e.sets||0)})
  }));
  return out
};
'''
          volume_anchor = 'function strengthChartGroups(ref) {'
          if 'const baseWeeklyPlannedMuscleSets' not in text:
              if volume_anchor not in text:
                  raise SystemExit('weekly volume patch anchor not found')
              text = text.replace(volume_anchor, volume_patch + '\n' + volume_anchor, 1)

          usability.write_text(text,encoding='utf-8')

          index=Path('training-lab/index.html')
          html=index.read_text(encoding='utf-8').replace('usability.js?v=601','usability.js?v=603')
          index.write_text(html,encoding='utf-8')

          sw=Path('training-lab/sw.js')
          sw_text=sw.read_text(encoding='utf-8').replace("training-lab-pages-v6-2","training-lab-pages-v6-3").replace('usability.js?v=601','usability.js?v=603')
          sw.write_text(sw_text,encoding='utf-8')

          test=Path('training-lab/tests/usability.cjs')
          t=test.read_text(encoding='utf-8')
          if 'season_mon_aesthetic' not in t:
              idx=t.rfind('console.log(')
              if idx<0: raise SystemExit('test end marker not found')
              addition=r'''
run(`state.settings.mode='season';document.getElementById('selectedDate').value='2026-09-07'`);
assert.equal(run(`seasonComplementTemplate().key`),'season_mon_aesthetic');
assert.equal(run(`seasonComplementTemplate().exercises.filter(e=>e.type==='strength').reduce((n,e)=>n+e.sets,0)`),13);
assert.equal(run(`seasonComplementTemplate().exercises.filter(e=>e.type==='mobility').length`),5);
run(`document.getElementById('selectedDate').value='2026-09-09'`);
assert.equal(run(`seasonComplementTemplate().key`),'season_wed_mobility');
assert.equal(run(`seasonComplementTemplate().exercises.every(e=>e.type==='mobility')`),true);
run(`document.getElementById('selectedDate').value='2026-09-12'`);
assert.equal(run(`seasonComplementTemplate().key`),'season_sat_aesthetic');
assert.equal(run(`seasonComplementTemplate().exercises.reduce((n,e)=>n+(e.sets||0),0)`),7);
'''
              t=t[:idx]+addition+t[idx:]
              test.write_text(t,encoding='utf-8')
          PY
      - name: Run Training Lab tests
        run: |
          cd training-lab
          node --check usability.js
          npm init -y >/dev/null 2>&1
          npm install --silent jsdom@26
          node tests/usability.cjs
      - name: Commit season complements
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-season-complements.yml
          git add training-lab/usability.js training-lab/index.html training-lab/sw.js training-lab/tests/usability.cjs
          git commit -m 'Add Training Lab season aesthetic and mobility complements'
          git push

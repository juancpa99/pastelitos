name: Generate SERIE PWA icons (temporary)
on:
  push:
    branches:
      - fix/serie-exercises-icon-discard-install-20261114
    paths:
      - .github/workflows/serie-icons-temp.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg==2.7.1
      - name: Render installed app icons from SERIE vector logo
        run: |
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url='serie/icon.svg', write_to=f'serie/icon-{size}.png', output_width=size, output_height=size)
          PY
      - name: Commit refreshed app icons to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serie/icon-192.png serie/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate SERIE installed-app icons from refreshed SVG"
            git push
          fi

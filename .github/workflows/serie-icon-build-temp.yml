name: Build SERIE icon PNGs (temporary)
on:
  push:
    branches:
      - fix/serie-olitas-icon-20261114
    paths:
      - .github/workflows/serie-icon-build-temp.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cairosvg==2.7.1
      - name: Create iOS and Android icons from SVG
        run: |
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url='serie/icon.svg', write_to=f'serie/icon-{size}.png', output_width=size, output_height=size)
          PY
      - name: Commit updated installed app PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add serie/icon-192.png serie/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "SERIE: generate mobile icons with three olitas"
            git push
          fi

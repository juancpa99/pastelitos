name: Training Lab direct assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/training-lab-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild direct CSS and JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const zlib = require('zlib');

          global.window = {};
          vm.runInThisContext(fs.readFileSync('training-lab/payload-css.js', 'utf8'));
          const cssB64 = window.__TL_CSS;
          if (!cssB64 || !/^[A-Za-z0-9+/=]+$/.test(cssB64)) throw new Error('CSS payload is not valid base64');
          const css = zlib.gunzipSync(Buffer.from(cssB64, 'base64'));
          fs.writeFileSync('training-lab/app.css', css);

          window.__TL_JS = '';
          for (let i = 1; i <= 4; i++) {
            vm.runInThisContext(fs.readFileSync(`training-lab/payload-js-${i}.js`, 'utf8'));
          }
          const jsB64 = window.__TL_JS;
          if (!jsB64 || !/^[A-Za-z0-9+/=]+$/.test(jsB64)) throw new Error('JS payload is not valid base64');
          const js = zlib.gunzipSync(Buffer.from(jsB64, 'base64'));
          fs.writeFileSync('training-lab/app.js', js);
          console.log(`Wrote app.css (${css.length} bytes) and app.js (${js.length} bytes)`);
          NODE

      - name: Switch public page to direct assets
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('training-lab/index.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'<script src="payload-css\.js"></script>\s*'
              r'<script src="payload-js-1\.js"></script>\s*'
              r'<script src="payload-js-2\.js"></script>\s*'
              r'<script src="payload-js-3\.js"></script>\s*'
              r'<script src="payload-js-4\.js"></script>\s*'
              r'<script>\s*async function __tlInflate\(b64\).*?</script>',
              re.S,
          )
          replacement = '<link rel="stylesheet" href="app.css?v=422-direct-1">\n<script src="app.js?v=422-direct-1"></script>'
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one compressed loader block, found {n}')
          p.write_text(s2, encoding='utf-8')

          sw = Path('training-lab/sw.js')
          t = sw.read_text(encoding='utf-8')
          t = re.sub(r"const CACHE='[^']+'", "const CACHE='training-lab-pages-v4-22-direct-1'", t, count=1)
          t = re.sub(
              r"const ASSETS=\[[^;]+;",
              "const ASSETS=['./','./index.html','./manifest.webmanifest','./icon.svg','./plantilla_plan.csv','./app.css','./app.js'];",
              t,
              count=1,
          )
          sw.write_text(t, encoding='utf-8')
          PY

      - name: Verify no atob loader remains
        run: |
          grep -q 'app.js?v=422-direct-1' training-lab/index.html
          grep -q 'app.css?v=422-direct-1' training-lab/index.html
          ! grep -q '__tlInflate' training-lab/index.html
          ! grep -q 'atob(' training-lab/index.html
          node --check training-lab/app.js
          test -s training-lab/app.css

      - name: Commit direct assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training-lab/index.html training-lab/app.js training-lab/app.css training-lab/sw.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix Training Lab public loader with direct assets'
            git push
          fi

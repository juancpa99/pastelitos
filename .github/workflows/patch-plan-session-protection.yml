name: Patch Training Lab session protection

on:
  push:
    paths:
      - '.github/workflows/patch-plan-session-protection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch plan import safely
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_training_lab.py
          python3 /tmp/patch_training_lab.py
      - name: Run existing Training Lab tests
        shell: bash
        run: |
          cd training-lab
          npm init -y >/dev/null 2>&1
          npm install --silent jsdom@26
          node tests/usability.cjs
      - name: Commit application patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training-lab/app.js training-lab/index.html training-lab/sw.js
          git commit -m 'Protect recorded sessions when updating Training Lab plans'
          git push

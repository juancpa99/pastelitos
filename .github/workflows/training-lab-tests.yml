name: MAREVO regression tests
on:
  pull_request:
    paths: ['training-lab/**', '.github/workflows/training-lab-tests.yml']
  push:
    branches: [main]
    paths: ['training-lab/**', '.github/workflows/training-lab-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: training-lab/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: training-lab
      - run: npm test
        working-directory: training-lab

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAREVO · Generador VAPID temporal</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08111e;color:#eef6ff}body{margin:0;padding:24px}.wrap{max-width:720px;margin:0 auto}.card{background:#101c2d;border:1px solid #26364d;border-radius:18px;padding:18px;margin-top:16px}.muted{color:#9db0c8;line-height:1.45}button{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:#38bdf8;color:#04111d;margin-top:10px}.copy{background:#1f3147;color:#eef6ff;margin-left:8px}textarea{width:100%;box-sizing:border-box;min-height:92px;margin-top:8px;padding:12px;border-radius:12px;border:1px solid #31445f;background:#07101c;color:#eef6ff;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}.hidden{display:none}.ok{color:#7dd3fc;font-weight:700}</style>
</head>
<body>
<div class="wrap">
<h1>MAREVO · VAPID</h1>
<p class="muted">Generador temporal. Las claves se crean dentro de este navegador con Web Crypto y no se envían a ningún servidor.</p>
<div class="card">
<strong>1. Genera las claves</strong><br>
<button id="generate">Generar claves VAPID</button>
<p id="status" class="muted"></p>
</div>
<div id="results" class="hidden">
<div class="card">
<strong>VAPID_PUBLIC_KEY</strong>
<textarea id="publicKey" readonly></textarea>
<button class="copy" data-target="publicKey">Copiar pública</button>
</div>
<div class="card">
<strong>VAPID_PRIVATE_KEY</strong>
<p class="muted">Guárdala como <b>Secret</b> en Vercel. No la pegues en chats ni en GitHub.</p>
<textarea id="privateKey" readonly></textarea>
<button class="copy" data-target="privateKey">Copiar privada</button>
</div>
</div>
</div>
<script>
function b64uToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))}
function bytesToB64u(bytes){let bin='';for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function generate(){
 const status=document.getElementById('status');
 status.textContent='Generando…';
 try{
  const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const pubJwk=await crypto.subtle.exportKey('jwk',pair.publicKey);
  const privJwk=await crypto.subtle.exportKey('jwk',pair.privateKey);
  const x=b64uToBytes(pubJwk.x),y=b64uToBytes(pubJwk.y);
  if(x.length!==32||y.length!==32||!privJwk.d)throw new Error('Formato de clave inesperado');
  const rawPub=new Uint8Array(65);rawPub[0]=4;rawPub.set(x,1);rawPub.set(y,33);
  document.getElementById('publicKey').value=bytesToB64u(rawPub);
  document.getElementById('privateKey').value=privJwk.d;
  document.getElementById('results').classList.remove('hidden');
  status.innerHTML='<span class="ok">Claves generadas correctamente.</span>';
 }catch(error){status.textContent='No se pudieron generar las claves en este navegador.'}
}
document.getElementById('generate').addEventListener('click',generate);
document.addEventListener('click',async event=>{
 const button=event.target.closest('[data-target]');if(!button)return;
 const el=document.getElementById(button.dataset.target);
 try{await navigator.clipboard.writeText(el.value);button.textContent='Copiado ✓';setTimeout(()=>button.textContent=button.dataset.target==='publicKey'?'Copiar pública':'Copiar privada',1200)}catch(error){el.select();document.execCommand('copy')}
});
</script>
</body>
</html>
